<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Emix (Privat)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e1e;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #444;
    }
    th {
      background-color: #333;
    }
    td a {
      color: skyblue;
    }
    #popup {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 1px solid red;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px red;
      text-align: center;
      z-index: 999;
    }
    #popup button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #waifu-img {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    #waifu-img img {
      width: 300px;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div id="popup">
  <p>Akses ditolak.<br>Aktivitas ini telah dicatat oleh sistem Emix.</p>
  <button onclick="closePopup()">Tutup</button>
</div>

<div id="dashboard"></div>
<div id="waifu-img">
  <p>Selamat datang di Dashboard Emix, berikut adalah gambar waifu untuk menyemangati kamu!</p>
  <img id="random-waifu" src="" alt="Waifu Random">
</div>

<script>
  const token = '7701966240:AAHFGHRVkXSnfOBt-FC5Ls991_t7nwSMbLA';
  const chatId = '8097806353';
  const pinBenar = "701280";
  
  const waifuImages = [
    "https://qu.ax/bcjic.jpg", "https://qu.ax/fmmvt.jpg", "https://qu.ax/ebNtV.jpg",
    "https://qu.ax/AHFNs.jpg", "https://qu.ax/XacQm.jpg", "https://qu.ax/lFwAH.jpg",
    "https://qu.ax/HRncZ.jpg", "https://qu.ax/DGcyJ.jpg", "https://qu.ax/kHGTR.jpg",
    "https://qu.ax/AOALq.jpg", "https://qu.ax/pZqgr.jpg", "https://qu.ax/bDBrH.jpg",
    "https://qu.ax/tnltW.jpg", "https://qu.ax/fiFgf.jpg", "https://qu.ax/EuJVY.jpg",
    "https://qu.ax/CZgTo.jpg", "https://qu.ax/JyCrk.jpg", "https://qu.ax/HwYeC.jpg",
    "https://qu.ax/AZyQV.jpg", "https://qu.ax/wgntx.jpg", "https://qu.ax/tECuN.jpg",
    "https://qu.ax/LWVXM.jpg", "https://qu.ax/rbwZH.jpg", "https://qu.ax/OQrmY.jpg",
    "https://qu.ax/nZVfe.jpg"
  ];

  const pin = prompt("Masukkan PIN Akses Dashboard:");

  if (pin !== pinBenar) {
    document.getElementById("popup").style.display = "block";

    const msg = `🚨 *Percobaan Akses Gagal ke Dashboard Emix*\n\nWaktu: ${new Date().toLocaleString()}\nStatus: PIN Salah\nDevice: Public`;

    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: chatId,
        text: msg,
        parse_mode: 'Markdown'
      })
    });
  } else {
    // Data Klien
    const clients = [
      {
        nama: "Andi",
        link: "https://emixstore.github.io/andi-topup",
        mulai: "2024-04-12",
        habis: "2024-05-12"
      },
      {
        nama: "Budi",
        link: "https://emixstore.github.io/budi-store",
        mulai: "2024-04-01",
        habis: "2024-04-30"
      }
    ];

    const dashboard = document.getElementById("dashboard");

    function hitungSisaHari(tanggalHabis) {
      const today = new Date();
      const endDate = new Date(tanggalHabis);
      const selisih = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
      return selisih;
    }

    function buatTabel() {
      let html = `<h2>Dashboard Klien Emix</h2>`;
      html += `
        <table>
          <thead>
            <tr>
              <th>Nama Klien</th>
              <th>Link Website</th>
              <th>Mulai</th>
              <th>Habis</th>
              <th>Sisa Hari</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
      `;
      clients.forEach(client => {
        const sisa = hitungSisaHari(client.habis);
        const status = sisa >= 0 ? 'Aktif' : 'Expired';
        html += `
          <tr>
            <td>${client.nama}</td>
            <td><a href="${client.link}" target="_blank">Kunjungi</a></td>
            <td>${client.mulai}</td>
            <td>${client.habis}</td>
            <td>${sisa >= 0 ? sisa + " hari" : "Expired"}</td>
            <td style="color:${sisa >= 0 ? 'lime' : 'red'}">${status}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      dashboard.innerHTML = html;
    }

    buatTabel();

    // Kirim gambar waifu random ke Telegram
    const randomWaifu = waifuImages[Math.floor(Math.random() * waifuImages.length)];

    fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: chatId,
        photo: randomWaifu,
        caption: "Selamat datang di Dashboard Emix! Semoga harimu menyenangkan!"
      })
    });

    // Tampilkan gambar waifu di halaman web
    document.getElementById("random-waifu").src = randomWaifu;
    document.getElementById("waifu-img").style.display = "block";
  }

  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }
</script>

</body>
</html>

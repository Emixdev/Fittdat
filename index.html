<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Emix (Privat)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h2, h3 {
      margin-bottom: 10px;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 10px #333;
    }
    #search {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 6px;
      border: none;
      width: 100%;
      max-width: 300px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e1e;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #444;
    }
    th {
      background-color: #333;
    }
    td a {
      color: skyblue;
    }
    #popup {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 1px solid red;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px red;
      text-align: center;
      z-index: 999;
    }
    #popup button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .form-group {
      margin-top: 20px;
    }
    .form-group input {
      padding: 6px;
      margin: 4px;
      border-radius: 5px;
      border: none;
    }
    .form-group button {
      padding: 8px 15px;
      background: limegreen;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body><div id="popup">
  <p>Akses ditolak.<br>Aktivitas ini telah dicatat oleh sistem Emix.</p>
  <button onclick="closePopup()">Tutup</button>
</div><div id="dashboard"></div><script>
  const pinBenar = "701280";
  const pin = prompt("Masukkan PIN Akses Dashboard:");

  const waifus = [
    "https://qu.ax/bcjic.jpg", "https://qu.ax/fmmvt.jpg", "https://qu.ax/ebNtV.jpg",
    "https://qu.ax/AHFNs.jpg", "https://qu.ax/XacQm.jpg", "https://qu.ax/lFwAH.jpg",
    "https://qu.ax/HRncZ.jpg", "https://qu.ax/DGcyJ.jpg", "https://qu.ax/kHGTR.jpg",
    "https://qu.ax/AOALq.jpg", "https://qu.ax/pZqgr.jpg", "https://qu.ax/bDBrH.jpg",
    "https://qu.ax/tnltW.jpg", "https://qu.ax/fiFgf.jpg", "https://qu.ax/EuJVY.jpg",
    "https://qu.ax/CZgTo.jpg", "https://qu.ax/JyCrk.jpg", "https://qu.ax/HwYeC.jpg",
    "https://qu.ax/AZyQV.jpg", "https://qu.ax/wgntx.jpg", "https://qu.ax/tECuN.jpg",
    "https://qu.ax/LWVXM.jpg", "https://qu.ax/rbwZH.jpg", "https://qu.ax/OQrmY.jpg",
    "https://qu.ax/nZVfe.jpg"
  ];

  function showPopup() {
    document.getElementById("popup").style.display = "block";
  }

  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }

  if (pin !== pinBenar) {
    showPopup();
  } else {
    const dashboard = document.getElementById("dashboard");
    const clients = JSON.parse(localStorage.getItem("emixClients")) || [];

    const sisaHari = (tgl) => {
      const today = new Date();
      const end = new Date(tgl);
      return Math.ceil((end - today) / (1000 * 60 * 60 * 24));
    };

    const tampilStats = () => {
      const aktif = clients.filter(c => sisaHari(c.habis) >= 0).length;
      const expired = clients.length - aktif;
      return `<div class='stats'>
        <div class='stat-box'>Total: ${clients.length}</div>
        <div class='stat-box'>Aktif: ${aktif}</div>
        <div class='stat-box'>Expired: ${expired}</div>
      </div>`;
    };

    const buatTabel = (list = clients) => {
      return `
        <input id='search' placeholder='Cari nama/link...'>
        ${tampilStats()}
        <table>
          <thead><tr><th>Nama</th><th>Link</th><th>Mulai</th><th>Habis</th><th>Sisa Hari</th><th>Status</th></tr></thead>
          <tbody>
            ${list.map(c => {
              const sisa = sisaHari(c.habis);
              const status = sisa >= 0 ? 'Aktif' : 'Expired';
              return `<tr>
                <td>${c.nama}</td>
                <td><a href='${c.link}' target='_blank'>Kunjungi</a></td>
                <td>${c.mulai}</td>
                <td>${c.habis}</td>
                <td>${sisa >= 0 ? sisa + ' hari' : 'Expired'}</td>
                <td style='color:${sisa >= 0 ? 'lime' : 'red'}'>${status}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `;
    };

    const formTambah = () => {
      return `
        <div class='form-group'>
          <h3>Tambah Klien Baru</h3>
          <input id='nama' placeholder='Nama'>
          <input id='link' placeholder='Link Website'>
          <input id='mulai' type='date'>
          <input id='habis' type='date'>
          <button onclick='tambahClient()'>Tambah</button>
        </div>
      `;
    };

    window.tambahClient = () => {
      const nama = document.getElementById('nama').value;
      const link = document.getElementById('link').value;
      const mulai = document.getElementById('mulai').value;
      const habis = document.getElementById('habis').value;
      if (nama && link && mulai && habis) {
        clients.push({ nama, link, mulai, habis });
        localStorage.setItem("emixClients", JSON.stringify(clients));
        location.reload();
      } else {
        alert("Lengkapi semua data klien.");
      }
    };

    dashboard.innerHTML = `
      <h2>Dashboard Klien Emix</h2>
      <img src="${waifus[Math.floor(Math.random()*waifus.length)]}" style="width:100%;max-width:300px;border-radius:12px;margin-bottom:20px">
      ${buatTabel()}
      ${formTambah()}
    `;

    document.getElementById("search").addEventListener("input", (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = clients.filter(c => c.nama.toLowerCase().includes(keyword) || c.link.toLowerCase().includes(keyword));
      dashboard.innerHTML = `
        <h2>Dashboard Klien Emix</h2>
        <img src="${waifus[Math.floor(Math.random()*waifus.length)]}" style="width:100%;max-width:300px;border-radius:12px;margin-bottom:20px">
        ${buatTabel(filtered)}
        ${formTambah()}
      `;
    });
  }
</script></body>
</html>

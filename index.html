<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Emix (Privat)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e1e;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #444;
    }
    th {
      background-color: #333;
    }
    td a {
      color: skyblue;
    }
    #popup {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 1px solid red;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px red;
      text-align: center;
      z-index: 999;
    }
    #popup button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #waifu-img {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    #waifu-img img {
      width: 300px;
      height: auto;
      border-radius: 12px;
    }
    form {
      margin-top: 30px;
      background: #191919;
      padding: 20px;
      border-radius: 12px;
    }
    form input {
      padding: 8px;
      margin: 5px;
      width: 22%;
      border-radius: 6px;
      border: none;
    }
    form button {
      padding: 10px 15px;
      background-color: limegreen;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div id="popup">
  <p>Akses ditolak.<br>Aktivitas ini telah dicatat oleh sistem Emix.</p>
  <button onclick="closePopup()">Tutup</button>
</div>

<div id="dashboard"></div>

<div id="waifu-img">
  <p>Selamat datang! Dashboard siap digunakan:</p>
  <img id="random-waifu" src="" alt="Waifu Random">
</div>

<form id="formTambah">
  <h3>Tambah Klien Baru</h3>
  <input type="text" id="nama" placeholder="Nama Klien" required>
  <input type="text" id="link" placeholder="Link Website" required>
  <input type="date" id="mulai" required>
  <input type="date" id="habis" required>
  <button type="submit">Tambah</button>
</form>

<script>
  const token = '7701966240:AAHFGHRVkXSnfOBt-FC5Ls991_t7nwSMbLA';
  const chatId = '8097806353';
  const pinBenar = "701280";

  const waifuImages = [
    "https://qu.ax/bcjic.jpg", "https://qu.ax/fmmvt.jpg", "https://qu.ax/ebNtV.jpg",
    "https://qu.ax/AHFNs.jpg", "https://qu.ax/XacQm.jpg", "https://qu.ax/lFwAH.jpg",
    "https://qu.ax/HRncZ.jpg", "https://qu.ax/DGcyJ.jpg", "https://qu.ax/kHGTR.jpg",
    "https://qu.ax/AOALq.jpg", "https://qu.ax/pZqgr.jpg", "https://qu.ax/bDBrH.jpg",
    "https://qu.ax/tnltW.jpg", "https://qu.ax/fiFgf.jpg", "https://qu.ax/EuJVY.jpg",
    "https://qu.ax/CZgTo.jpg", "https://qu.ax/JyCrk.jpg", "https://qu.ax/HwYeC.jpg",
    "https://qu.ax/AZyQV.jpg", "https://qu.ax/wgntx.jpg", "https://qu.ax/tECuN.jpg",
    "https://qu.ax/LWVXM.jpg", "https://qu.ax/rbwZH.jpg", "https://qu.ax/OQrmY.jpg",
    "https://qu.ax/nZVfe.jpg"
  ];

  const pin = prompt("Masukkan PIN Akses Dashboard:");
  const dashboard = document.getElementById("dashboard");
  const waifu = waifuImages[Math.floor(Math.random() * waifuImages.length)];
  let clients = [
    {
      nama: "Andi",
      link: "https://emixstore.github.io/andi-topup",
      mulai: "2024-04-12",
      habis: "2024-05-12"
    },
    {
      nama: "Budi",
      link: "https://emixstore.github.io/budi-store",
      mulai: "2024-04-01",
      habis: "2024-04-30"
    }
  ];

  function hitungSisaHari(tanggalHabis) {
    const today = new Date();
    const end = new Date(tanggalHabis);
    return Math.ceil((end - today) / (1000 * 60 * 60 * 24));
  }

  function renderTabel() {
    let html = `<h2>Dashboard Klien Emix</h2>`;
    html += `
      <table>
        <thead>
          <tr>
            <th>Nama</th><th>Link</th><th>Mulai</th><th>Habis</th><th>Sisa Hari</th><th>Status</th>
          </tr>
        </thead>
        <tbody>
    `;
    clients.forEach(client => {
      const sisa = hitungSisaHari(client.habis);
      const status = sisa >= 0 ? 'Aktif' : 'Expired';
      html += `
        <tr>
          <td>${client.nama}</td>
          <td><a href="${client.link}" target="_blank">Kunjungi</a></td>
          <td>${client.mulai}</td>
          <td>${client.habis}</td>
          <td>${sisa >= 0 ? sisa + " hari" : "Expired"}</td>
          <td style="color:${sisa >= 0 ? 'lime' : 'red'}">${status}</td>
        </tr>
      `;
    });
    html += `</tbody></table>`;
    dashboard.innerHTML = html;
  }

  if (pin !== pinBenar) {
    document.getElementById("popup").style.display = "block";
    const gagal = `🚨 *Login Gagal*\nWaktu: ${new Date().toLocaleString()}\nPIN salah.`;
    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: gagal, parse_mode: "Markdown" })
    });
  } else {
    renderTabel();
    document.getElementById("random-waifu").src = waifu;
    document.getElementById("waifu-img").style.display = "block";

    const berhasil = `✅ *Login Berhasil*\nWaktu: ${new Date().toLocaleString()}\nDashboard Emix telah diakses.`;
    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: berhasil, parse_mode: "Markdown" })
    });
  }

  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }

  document.getElementById("formTambah").addEventListener("submit", function(e) {
    e.preventDefault();
    const nama = document.getElementById("nama").value;
    const link = document.getElementById("link").value;
    const mulai = document.getElementById("mulai").value;
    const habis = document.getElementById("habis").value;

    clients.push({ nama, link, mulai, habis });
    renderTabel();
    this.reset();
  });
</script>

</body>
</html>
